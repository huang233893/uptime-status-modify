<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <link rel="shortcut icon" href="./favicon.ico" type="image/x-icon" />
    <!-- 反 FOUC：防止 HTML 先于 CSS 渲染出无样式裸内容 -->
    <style>
      html { visibility: hidden; }
      html.loaded { visibility: visible; }
    </style>
    <!-- Material Symbols Outlined -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet" />
    <title></title>
    <script src="./config.js"></script>
  </head>
  <body>
    <!-- 主内容容器 -->
    <div id="app"></div>

    <!-- 底部统计区（直接嵌入 HTML，确保唯一） -->
    <footer id="footer">
      <div class="footer-content">
        <div class="footer-row">
          <div class="api-info">
            <span class="material-symbols-outlined">monitor_heart</span>
            <span>基于 <strong>UptimeRobot</strong> 接口制作 · 检测频率 5 分钟</span>
          </div>
          <div class="footer-meta">
            <span>© 2026 Supermini233</span>
            <a href="https://github.com/huang233893/uptime-status-modify">Powered by Uptime-Status-Modify</a>
            <span class="footer-version">v3.0.5</span>
          </div>
        </div>
      </div>
    </footer>
  </body>
</html>
